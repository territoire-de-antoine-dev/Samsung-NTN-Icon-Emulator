name: Compiler APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Installer le SDK Android depuis le runner
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          echo "SDK Manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compiler APK debug
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Satellite-Visual-LSPosed-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release]') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Satellite-Visual-LSPosed-APK
          path: dist
      - name: Publish versioned APK and bilingual release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n -E "s/.*versionName '([^']+)'.*/\1/p" app/build.gradle)
          test -n "$VERSION"
          test -f dist/app-debug.apk
          TAG="v$VERSION"
          APK="Samsung-SATIconEmul-$TAG.apk"
          cp dist/app-debug.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace the public binary."
            exit 1
          fi
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Samsung SATIconEmul’ $TAG" --notes-file RELEASE_NOTES.md --latest
